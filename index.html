 <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
*{
    font-family: 'Poppins', sans-serif;
}
body{
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
h1{
    text-align: center;
}
div{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
   
}

a{
    text-decoration: none;
    color: black;
    border: solid 1px black;
    padding: 10px;
    margin: 5px;
    width: 5rem;
    text-align: center;
    border-radius: 20px;
    transition: all .3s;
    
}

a:hover{
    color: white;
    background-color: black;
    transition: all .3s;
}

footer{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 100px auto;
    
}

footer label , a-footer{
    font-family: "Poppins", sans-serif;
    color: rgb(112, 112, 112);
    text-align: center;
    text-decoration: none;
    transition: all .3s;
}

a-footer:hover{
    color: #e0a761;

}

.fas{
    cursor: pointer;
    font-size: 20px;
    color: black;
    padding: 10px;
    border-radius: 100px;
    transition: all .3s;
    position: fixed;
    bottom: 0;
    left: 0;
}

.fas:hover{
    background-color: rgb(248, 248, 248);
    cursor: pointer;
}

 </style>
 <style>
    .notice-box {
        display: none;
        background-color: #fffef2; /* Subtle yellow, not too bright */
        border: 2px solid #e6e2c8;
        border-radius: 8px;
        padding: 20px;
        max-width: 600px;
        margin: 20px auto;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: #333;
        width: 300px;
        
    }

    .notice-box i {
        color: #d4c107; /* Slightly muted yellow for the icon */
        margin-right: 10px;
    }

    .notice-box p {
        margin: 0;
        line-height: 1.6;
        font-size: 12px;
    }

    .notice-box a {
        color: #d4c107;
        text-decoration: none;
        font-weight: bold;
    }

    .notice-box a:hover {
        text-decoration: underline;
        background-color: transparent;
    }

    .link{
    
     
     border: 0;
    padding: 0;
     margin: 0px;
     width: 0rem;
     text-align: 0;
     border-radius: 0;
     transition: 0;
     

    }
</style>
<script>
    const body = document.getElementById('body');

   
   var isLogin = localStorage.getItem('isLogin');
 

    if(isLogin !== 'true'){
        window.location.href = `login.html`;
    }
    else{
        body.style.display = 'flex';
    }
   
$('#signOut').on('click',function(){
    localStorage.setItem('isLogin', 'false');
    window.location.href = `login.html`;

} )



</script>

            };
    
            // Initialize Firebase
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
    
            // Reference to your data in Firebase
            const noticeRef = database.ref('notice/index-admins');
    
            // Fetch data from Firebase
            noticeRef.on('value', (snapshot) => {
                const data = snapshot.val();
            if(data){
                document.getElementById('notice-box').style.display = "flex"
                document.getElementById('notice-box').innerHTML = data
            }
            })
    
</script>
